# ─────────────────────────────────────────────────────────────────────────────
#  Postiz – Social-Media-Manager (optimierte Version für Mentale Schonkost)
#
#  Basis: offizielles gitroomhq/postiz-docker-compose (Postiz v1.47)
#  Unterschiede zum Original – siehe ANLEITUNG.md, Abschnitt "Was optimiert ist":
#    • alle Passwörter & Schlüssel liegen in .env (nicht mehr im Klartext hier)
#    • Registrierung gesperrt – nur DU hast ein Konto (dein erstes Konto geht immer)
#    • automatisches HTTPS über Caddy (Profil "https") für den Server-Betrieb
#    • nicht benötigte Debug-Container entfernt → ca. 400 MB weniger RAM
#    • Log-Größe begrenzt, damit die Festplatte nicht vollläuft
#    • Datenbank-/Temporal-Ports nur intern erreichbar
#
#  Start:   ./setup.sh           (erzeugt .env und startet alles)
#  Stopp:   docker compose down
# ─────────────────────────────────────────────────────────────────────────────

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:${POSTIZ_VERSION:-v1.47.0}
    container_name: postiz
    restart: always
    logging: *logging
    # Alle Einstellungen (Social-Media-Schlüssel, KI, Speicher …) kommen aus .env
    env_file: .env
    environment:
      MAIN_URL: ${POSTIZ_URL}
      FRONTEND_URL: ${POSTIZ_URL}
      NEXT_PUBLIC_BACKEND_URL: ${POSTIZ_URL}/api
      BACKEND_INTERNAL_URL: http://localhost:3000
      DATABASE_URL: postgresql://postiz-user:${POSTGRES_PASSWORD}@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: "true"
      RUN_CRON: "true"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      NX_ADD_PLUGINS: "false"
    volumes:
      - postiz-config:/config/
      - postiz-uploads:/uploads/
    ports:
      # Standard: nur auf diesem Rechner erreichbar (http://localhost:4007).
      # Auf dem Server übernimmt Caddy (unten) HTTPS nach außen.
      - "${POSTIZ_BIND:-127.0.0.1}:4007:5000"
    networks:
      - postiz-network
      - temporal-network
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      temporal:
        condition: service_healthy

  postiz-postgres:
    image: postgres:17-alpine
    container_name: postiz-postgres
    restart: always
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    networks:
      - postiz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz-user -d postiz-db-local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postiz-redis:
    image: redis:7.2
    container_name: postiz-redis
    restart: always
    logging: *logging
    # Redis-Speicher auf 256 MB begrenzt; "noeviction" = nie still Daten verwerfen
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postiz-redis-data:/data
    networks:
      - postiz-network

  # ── Temporal: plant & verschickt deine Posts pünktlich im Hintergrund ──────
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    restart: always
    logging: *logging
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    networks:
      - temporal-network
    expose:
      - 9200
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - temporal-elasticsearch-data:/usr/share/elasticsearch/data

  temporal-postgresql:
    image: postgres:16
    container_name: temporal-postgresql
    restart: always
    logging: *logging
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_DB_PASSWORD}
      POSTGRES_USER: temporal
    networks:
      - temporal-network
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always
    logging: *logging
    depends_on:
      temporal-postgresql:
        condition: service_healthy
      temporal-elasticsearch:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - POSTGRES_SEEDS=temporal-postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=true
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - TEMPORAL_NAMESPACE=default
    networks:
      - temporal-network
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig

  # ── Nur für Fehlersuche: docker compose --profile debug up -d ─────────────
  temporal-ui:
    profiles: [debug]
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    restart: unless-stopped
    logging: *logging
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    networks:
      - temporal-network
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # ── HTTPS für den Server: docker compose --profile https up -d ────────────
  # Holt automatisch ein kostenloses Let's-Encrypt-Zertifikat für POSTIZ_DOMAIN.
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    container_name: postiz-caddy
    restart: always
    logging: *logging
    environment:
      POSTIZ_DOMAIN: ${POSTIZ_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - postiz-network
    depends_on:
      - postiz

  # ── Laptop ohne Server: docker compose --profile tunnel up -d ────────────
  # Cloudflare-Tunnel: macht Postiz unter deiner https-Adresse erreichbar,
  # ohne offene Ports und ohne Server. Token steht in .env.
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:2025.8.0
    container_name: postiz-tunnel
    restart: always
    logging: *logging
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - postiz-network
    depends_on:
      - postiz

volumes:
  postgres-volume:
  postiz-redis-data:
  postiz-config:
  postiz-uploads:
  temporal-postgres-data:
  temporal-elasticsearch-data:
  caddy-data:
  caddy-config:

networks:
  postiz-network:
  temporal-network:
    name: temporal-network
